<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enhanced AR App</title>

  <!-- Start connecting to the servers early so files load faster -->
  <link rel="preconnect" href="https://aframe.io">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://raw.githubusercontent.com">

  <!-- 1. A-Frame: 3D engine -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- 2. AR.js: camera + marker tracking -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    // Ball color change on tap
    AFRAME.registerComponent('color-changer', {
      init: function () {
        var el = this.el;
        var colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
        el.addEventListener('click', function () {
          var randomColor = colors[Math.floor(Math.random() * colors.length)];
          el.setAttribute('material', 'color', randomColor);
        });
      }
    });

    // Box grows / shrinks on tap
    AFRAME.registerComponent('scaler-toggle', {
      init: function () {
        var el = this.el;
        var isScaled = false;
        el.addEventListener('click', function () {
          isScaled = !isScaled;
          el.setAttribute('scale', isScaled ? '0.6 0.6 0.6' : '0.4 0.4 0.4');
        });
      }
    });
  </script>

  <style>
    #status-banner {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 8px;
      background: rgba(255, 140, 0, 0.9);
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <div id="status-banner">Status: Loading 3D model...</div>

  <!--
    Speed settings explained:
    - sourceWidth/Height + displayWidth/Height = 640x480: smaller camera image = faster marker detection
    - maxDetectionRate: 30 = check for the marker up to 30 times per second
    - detectionMode: mono = simple black & white detection (fast, works for Hiro)
    - smooth: false = objects appear instantly (no delay for smoothing)
    - antialias: false = lighter on the phone's graphics
  -->
  <a-scene embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: false; alpha: true; powerPreference: high-performance"
    arjs="sourceType: webcam;
          sourceWidth: 640; sourceHeight: 480;
          displayWidth: 640; displayHeight: 480;
          detectionMode: mono;
          maxDetectionRate: 30;
          smooth: false;
          debugUIEnabled: false;">

    <a-assets timeout="30000">
      <a-asset-item id="avocado-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" id="hiro-marker">

      <a-text value="AR Experience"
              position="0 1.6 0"
              align="center"
              color="#000000"
              scale="0.9 0.9 0.9">
      </a-text>

      <!-- Top Left: Rotating Box -->
      <a-box position="-0.7 0.3 -0.7"
             scale="0.4 0.4 0.4"
             material="color: #4CC3D9;"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;">
      </a-box>

      <!-- Top Right: Floating Cylinder (fewer polygons = faster) -->
      <a-cylinder position="0.7 0.3 -0.7"
                  radius="0.2" height="0.4"
                  segments-radial="16"
                  material="color: #FFC65D;"
                  animation="property: position; to: 0.7 0.7 -0.7; dir: alternate; loop: true; dur: 1500;">
      </a-cylinder>

      <!-- Bottom Left: Interactive Sphere (fewer polygons = faster) -->
      <a-sphere position="-0.7 0.3 0.7"
                radius="0.2"
                segments-width="16" segments-height="12"
                material="color: #EF2D5E;"
                color-changer
                class="raycastable">
      </a-sphere>

      <!-- Bottom Right: Tappable Scaling Box -->
      <a-box position="0.7 0.3 0.7"
             scale="0.4 0.4 0.4"
             material="color: #7BC8A4;"
             scaler-toggle
             class="raycastable">
      </a-box>

      <!-- Center: 3D Avocado Model -->
      <a-entity gltf-model="#avocado-model"
                position="0 0.15 0"
                scale="4 4 4">
      </a-entity>

    </a-marker>

    <a-entity camera>
      <a-entity cursor="fuse: false; rayOrigin: mouse;"
                raycaster="objects: .raycastable">
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var marker = document.querySelector('#hiro-marker');
      var banner = document.querySelector('#status-banner');
      var assets = document.querySelector('a-assets');
      var modelReady = false;

      function setBanner(color, text) {
        banner.style.background = color;
        banner.textContent = text;
      }

      // Tell the user when the model has finished downloading
      assets.addEventListener('loaded', function () {
        modelReady = true;
        setBanner('rgba(255, 0, 0, 0.8)', 'Status: Ready — Point Camera at Hiro Marker');
      });

      marker.addEventListener('markerFound', function () {
        if (modelReady) {
          setBanner('rgba(0, 180, 0, 0.8)', 'Status: Marker Found! Interactive AR Loaded');
        } else {
          setBanner('rgba(255, 140, 0, 0.9)', 'Status: Marker Found — Model still loading...');
        }
      });

      marker.addEventListener('markerLost', function () {
        if (modelReady) {
          setBanner('rgba(255, 0, 0, 0.8)', 'Status: Marker Lost — Point Camera at Hiro Marker');
        }
      });
    });
  </script>
</body>
</html>
